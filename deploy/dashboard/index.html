<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jobbi Home</title><style>
:root{color-scheme:light dark;--bg:#f7f6f2;--card:#fff;--ink:#1d2420;--muted:#59665e;--accent:#167445;--line:#deded6}@media(prefers-color-scheme:dark){:root{--bg:#121815;--card:#1b231f;--ink:#e9efe9;--muted:#a5b2a9;--accent:#4ade80;--line:#344039}}*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);margin:0;font:16px/1.5 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:28px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(2.2rem,6vw,3.3rem);line-height:1.1;margin-bottom:8px}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.card h2{font-size:1.2rem;margin:6px 0}.badge{font-size:.8rem;color:var(--muted)}.up{color:var(--accent)}a,button{color:var(--accent);font-weight:600}button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer}progress{width:100%;accent-color:var(--accent)}footer{margin-top:25px}</style></head><body><main><header><b>JOBBISOFT / HOME</b><button id="lang">Español</button></header><h1 id="title">Your cloud.</h1><p class="muted" id="lead"></p><div class="card"><b id="storageLabel">Server storage</b><p id="disk">—</p><progress id="meter" max="100" value="0"></progress><small id="storageNote"></small></div><h2 id="appsLabel">Your applications</h2><div id="apps" class="grid"></div><footer class="muted" id="notice"></footer></main><script>
'use strict';const $=id=>document.getElementById(id);let es=false,cfg,stats;try{es=localStorage.getItem('jobbi-dashboard-lang')==='es'}catch{}const tr=(a,b)=>es?b:a;
function render(){if(!cfg)return;document.documentElement.lang=es?'es':'en';$('lang').textContent=es?'English':'Español';$('title').textContent=cfg.name;$('lead').textContent=tr('Your private server, in one place.','Tu servidor privado, en un solo lugar.');$('storageLabel').textContent=tr('Data filesystem capacity','Capacidad del sistema de archivos');$('storageNote').textContent=tr('Docker volumes on other disks may differ.','Los volúmenes Docker en otros discos pueden variar.');$('appsLabel').textContent=tr('Your applications','Tus aplicaciones');$('notice').textContent=tr('Private network only. Each app has its own login. Reachable means HTTP response, not a complete test.','Solo red privada. Cada app tiene su propio acceso. Disponible indica respuesta HTTP, no una prueba completa.');$('apps').replaceChildren();for(const a of cfg.apps){let box=document.createElement('article');box.className='card';let status=document.createElement('span');let state=stats?.apps.find(x=>x.id===a.id)?.state||'checking';status.className='badge '+(state==='reachable'?'up':'');status.textContent=({reachable:tr('● Reachable','● Disponible'),unavailable:tr('● Unavailable','● No disponible'),manual:tr('Manual setup','Configuración manual'),checking:tr('Checking…','Comprobando…')})[state];let h=document.createElement('h2');h.textContent=a.name;let p=document.createElement('p');p.textContent=es?a.es:a.en;box.append(status,h,p);if(a.port||a.url){let l=document.createElement('a');l.href=a.url||('http://'+location.hostname+':'+a.port+(a.path||'/'));l.textContent=tr('Open application','Abrir aplicación');l.target='_blank';l.rel='noopener noreferrer';box.append(l)}if(a.note){let p=document.createElement('p');p.className='muted';p.textContent=es?a.noteEs:a.note;box.append(p)}$('apps').append(box)}if(stats?.disk){let d=stats.disk;let gb=x=>(x/1e9).toFixed(1)+' GB';$('disk').textContent=gb(d.free)+tr(' free of ',' libres de ')+gb(d.total);$('meter').value=d.total?100*d.used/d.total:0}}
async function refresh(){try{stats=await fetch('/api/status',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});render()}catch{$('disk').textContent=tr('Status unavailable','Estado no disponible')}}
$('lang').onclick=()=>{es=!es;try{localStorage.setItem('jobbi-dashboard-lang',es?'es':'en')}catch{}render()};fetch('/api/config').then(r=>r.json()).then(c=>{cfg=c;render();refresh();setInterval(refresh,30000)}).catch(()=>{$('lead').textContent='Configuration unavailable'});
</script></body></html>
