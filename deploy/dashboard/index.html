<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jobbi Home</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f3;--card:#fff;--ink:#17251d;--muted:#59695f;--accent:#187446;--line:#dce4dc;--soft:#eaf3ed}
@media(prefers-color-scheme:dark){:root{--bg:#111914;--card:#1b241e;--ink:#e7f0e9;--muted:#a8b5aa;--accent:#6ee7a0;--line:#35433a;--soft:#25362b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:28px clamp(16px,4vw,44px) 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
header>b{font-size:.75rem;letter-spacing:.13em;color:var(--accent)}
h1{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.045em;line-height:1.13;margin:12px 0;overflow-wrap:anywhere}h2{font-size:1.35rem;letter-spacing:-.02em}
.muted,small{color:var(--muted)}.welcome{padding:30px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.welcome p{margin:0}.welcome-mark{width:96px;height:96px;flex:0 0 96px;border-radius:26px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.welcome-mark svg{width:60px;height:60px}nav{display:flex;gap:8px;margin:0 0 22px}
button{font:inherit;font-weight:650;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;transition:background .15s,transform .15s}button[aria-current=page]{background:var(--soft);color:var(--accent);border-color:var(--accent)}button:active{transform:translateY(1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 24px #14251b0a}
.app{display:flex;flex-direction:column;gap:8px}.app .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.app-icon{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;background:var(--soft);color:var(--accent)}
.app-icon svg{width:28px;height:28px}.app h3{font-size:1.2rem;margin:6px 0 0;letter-spacing:-.02em}.app p{font-size:.95rem;color:var(--muted);margin:0}
.badge{font-size:.75rem;color:var(--muted);padding:5px 9px;border-radius:20px;background:var(--bg);white-space:nowrap}
.up{color:var(--accent);background:var(--soft)}.app a{display:inline-block;align-self:flex-start;margin-top:auto;padding:8px 0;color:var(--accent);font-weight:700;text-decoration:none}
.app a:hover{text-decoration:underline}.app details{font-size:.84rem;color:var(--muted)}summary{cursor:pointer}
#disk{font-size:clamp(1.5rem,4vw,2.3rem);font-weight:700;letter-spacing:-.035em;margin:8px 0}progress{width:100%;height:14px;accent-color:var(--accent);display:block;margin-bottom:10px}
.status-list{display:grid;gap:4px}.status-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.status-row:last-child{border:0}
 .setup-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.setup-actions a{color:var(--accent);font-weight:650}footer{margin-top:28px;font-size:.85rem}footer details{border-top:1px solid var(--line);padding-top:12px}
[hidden]{display:none!important}section:not([hidden]){animation:appear .25s ease-out}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:540px){.welcome{padding:20px 0 15px}.welcome-mark{width:64px;height:64px;flex-basis:64px;border-radius:18px}.welcome-mark svg{width:38px;height:38px}.grid{grid-template-columns:1fr}.card{padding:16px}nav{flex-wrap:wrap}nav button{flex:1 1 42%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main>
<header><b>JOBBISOFT / HOME</b><button id="lang" type="button">Español</button></header>
<div class="welcome"><div><small id="eyebrow">PRIVATE HOME CLOUD</small><h1 id="title">Your cloud.</h1><p class="muted" id="lead"></p></div><div class="welcome-mark" id="homeIcon" aria-hidden="true"></div></div>
<nav aria-label="Home"><button id="appsTab" type="button" aria-current="page">Your apps</button><button id="statusTab" type="button">Server status</button><button id="setupTab" type="button">Setup</button><button id="maintenanceTab" type="button">Maintenance</button><button id="storageTab" type="button">Storage</button><button id="recoveryTab" type="button">Recovery</button></nav>
<section id="appsPage"><h2 id="appsLabel">Your applications</h2><div id="apps" class="grid"></div></section>
<section id="statusPage" hidden><h2 id="statusLabel">Server status</h2><div class="card"><b id="storageLabel">Server storage</b><p id="disk">—</p><progress id="meter" max="100" value="0" aria-label="Storage used"></progress><small id="storageNote"></small></div><h2 id="availabilityLabel">Application availability</h2><div class="card status-list" id="statusList"></div></section>
<section id="setupPage" hidden><h2 id="setupLabel">Set up your home</h2><p id="setupLead" class="muted"></p><div id="setupList" class="card status-list"></div></section><section id="maintenancePage" hidden><h2 id="maintenanceLabel">Maintenance</h2><p id="healthTime" class="muted"></p><div id="healthCards" class="grid"></div></section><section id="storagePage" hidden><h2 id="storageTitle">Storage</h2><div id="storageCards" class="grid"></div><h3 id="driveTitle">Drive health</h3><div id="driveRows" class="card status-list"></div><p id="storageHelp" class="muted"></p></section><section id="recoveryPage" hidden><h2 id="recoveryTitle">Update &amp; recovery</h2><div id="recoveryCards" class="grid"></div><p id="recoveryHelp" class="muted"></p></section><footer class="muted"><details><summary id="helpLabel">About your private server</summary><p id="notice"></p></details></footer>
</main><script>
'use strict';
const $=id=>document.getElementById(id);let es=false,cfg,stats,health,failed=false;try{es=localStorage.getItem('jobbi-dashboard-lang')==='es'}catch{}const tr=(a,b)=>es?b:a;
const lineIcons={"music":"M9 18V5l12-2v13M9 18a3 2 0 1 1-6 0 3 2 0 0 1 6 0Zm12-2a3 2 0 1 1-6 0 3 2 0 0 1 6 0Z","movies":"M4 5h16v14H4zM9 9l6 3-6 3z","photos":"M3 4h18v16H3zM3 17l6-6 5 5 3-3 4 4M15 8h.01","files":"M3 6h7l2 3h9v11H3z","passwords":"M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4M12 15v2","tasks":"M5 3h14v18H5zM8 9l2 2 4-4M8 16h8","dns":"M12 3 4 6v6c0 4 4 7 8 9 4-2 8-5 8-9V6zM9 12l2 2 4-4","remote":"M8 6h8M8 18h8M4 8v8m16-8v8M4 12h16M7 9l-3 3 3 3m10-6 3 3-3 3","monitor":"M3 4h18v13H3zM8 21h8m-4-4v4M6 11h3l2-4 3 7 2-3h2","navidrome":"M4 4h16v16H4zM12 8a4 4 0 1 0 0 8 4 4 0 1 0 0-8Z","hardware":"M5 3h14v18H5zM8 7h8M8 11h8m0 6h.01","hdd":"M4 5h16v14H4zM7 15h10m-1-6h.01","overview":"M3 10l9-7 9 7v11H3zM9 21v-8h6v8","costing":"M12 2v20M17 7H9a3 3 0 0 0 0 6h6a3 3 0 0 1 0 6H7","orders":"M6 3h12v18H6zM9 8h6M9 12h6M9 16h3","installation":"M4 4h16v16H4zM8 8h8M8 12h8M8 16h4","support":"M4 13v-2a8 8 0 0 1 16 0v2M4 12h3v6H4zM17 12h3v6h-3zM20 18v2h-6","documents":"M5 3h9l5 5v13H5zM14 3v5h5M8 13h8m-8 4h6"};
function lineIcon(id){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),p=document.createElementNS(ns,'path');for(const [k,v] of Object.entries({viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':'1.65','stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true'}))svg.setAttribute(k,v);p.setAttribute('d',lineIcons[id]||lineIcons.hardware);svg.append(p);return svg}
function create(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function stateFor(id){return failed?'unavailable':stats?.apps.find(x=>x.id===id)?.state||'checking'}
function badge(e,id){const state=stateFor(id);e.className='badge '+(state==='reachable'?'up':'');e.textContent=({reachable:tr('● Reachable','● Disponible'),unavailable:tr('● Unavailable','● No disponible'),manual:tr('Manual setup','Configuración manual'),checking:tr('Checking…','Comprobando…')})[state]||tr('Unknown','Desconocido')}
function updateStatus(){if(!cfg)return;for(const e of document.querySelectorAll('[data-status]'))badge(e,e.dataset.status);if(failed){$('disk').textContent=tr('Status unavailable','Estado no disponible');$('meter').value=0;return}if(stats?.disk){const d=stats.disk;const gb=x=>(x/1e9).toFixed(1)+' GB';$('disk').textContent=gb(d.free)+tr(' free of ',' libres de ')+gb(d.total);$('meter').value=d.total?100*d.used/d.total:0}}
function render(){document.documentElement.lang=es?'es':'en';$('lang').textContent=es?'English':'Español';$('eyebrow').textContent=tr('PRIVATE HOME CLOUD','NUBE PRIVADA EN CASA');$('title').textContent=cfg?.name||tr('Your cloud.','Tu nube.');$('lead').textContent=tr('Your private server, in one place.','Tu servidor privado, en un solo lugar.');$('storageLabel').textContent=tr('Data filesystem capacity','Capacidad del sistema de archivos');$('storageNote').textContent=tr('Docker volumes on other disks may differ.','Los volúmenes Docker en otros discos pueden variar.');$('appsLabel').textContent=tr('Your applications','Tus aplicaciones');$('appsTab').textContent=tr('Your apps','Tus apps');$('statusTab').textContent=tr('Server status','Estado del servidor');$('statusLabel').textContent=$('statusTab').textContent;$('availabilityLabel').textContent=tr('Application availability','Disponibilidad de aplicaciones');$('helpLabel').textContent=tr('About your private server','Acerca de tu servidor privado');$('notice').textContent=tr('Private network only. Each app has its own login. Reachable means HTTP response, not a complete test.','Solo red privada. Cada app tiene su propio acceso. Disponible indica respuesta HTTP, no una prueba completa.');
if(!cfg)return;$('apps').replaceChildren();$('statusList').replaceChildren();
for(const a of cfg.apps){const card=create('article',undefined,'card app'),top=create('div',undefined,'top'),icon=create('span',undefined,'app-icon'),status=create('span');status.dataset.status=a.id;icon.append(lineIcon(a.id));top.append(icon,status);card.append(top,create('h3',a.name),create('p',es?a.es:a.en));if(a.port||a.url){const l=create('a',tr('Open application','Abrir aplicación'));l.href=a.url||('http://'+location.hostname+':'+a.port+(a.path||'/'));l.target='_blank';l.rel='noopener noreferrer';card.append(l)}if(a.note){const d=create('details');d.append(create('summary',tr('Setup note','Nota de configuración')),create('p',es?a.noteEs:a.note));card.append(d)}$('apps').append(card);const row=create('div',undefined,'status-row'),s=create('span');s.dataset.status=a.id;row.append(create('span',a.name),s);$('statusList').append(row)}updateStatus();renderHealth()}
function page(name){for(const id of ['apps','status','setup','maintenance','storage','recovery']){$(id+'Page').hidden=id!==name;$(id+'Tab').setAttribute('aria-current',id===name?'page':'false')}}
function renderHealth(){
  $('setupTab').textContent=tr('Setup','Configuración');$('maintenanceTab').textContent=tr('Maintenance','Mantenimiento');$('setupLabel').textContent=tr('Set up your home','Configura tu hogar');$('maintenanceLabel').textContent=$('maintenanceTab').textContent;$('setupLead').textContent=tr('Finish accounts with your technician. Open each application to sign in. Verified setup requires an actual functional test.','Completa las cuentas con tu técnico. Abre cada aplicación. La verificación requiere una prueba funcional.');
  $('setupList').replaceChildren();for(const a of cfg?.apps||[]){const row=create('div',undefined,'status-row');const name=create('span',a.name);const done=(health?.onboarding||[]).includes(a.id);const right=create('div',undefined,'setup-actions');right.append(create('span',done?tr('Confirmed','Confirmado'):tr('Pending','Pendiente'),'badge '+(done?'up':'')));if(!done&&(a.port||a.url)){const link=create('a',tr('Open','Abrir'));link.href=a.url||('http://'+location.hostname+':'+a.port+(a.path||'/'));link.target='_blank';link.rel='noopener noreferrer';right.append(link)}row.append(name,right);$('setupList').append(row)}
  const at=Date.parse(health?.at||'');const valid=Number.isFinite(at)&&Date.now()-at<45*60*1000&&at<=Date.now()+60000;$('healthTime').textContent=valid?tr('Updated ','Actualizado ')+new Date(at).toLocaleString():tr('Health data unavailable or stale. Contact your technician.','Datos de salud no disponibles o desactualizados. Contacta a tu técnico.');
  const cards=$('healthCards');cards.replaceChildren();const unknown=tr('Not checked','Sin comprobar');function tile(title,value,detail,target=cards){const c=create('article',undefined,'card');c.append(create('small',title),create('h2',value),create('p',detail,'muted'));target.append(c)}const metric=x=>valid&&typeof x==='number'?x+'%':unknown;
  tile(tr('Storage free','Espacio libre'),metric(health?.data_free_percent),tr('Data filesystem','Sistema de archivos'));tile(tr('System disk free','Disco del sistema libre'),metric(health?.docker_free_percent),tr('Docker storage','Almacenamiento Docker'));
  const temps=valid?[...(health?.temperature_c||[]),...(health?.drives||[]).map(d=>d.temperature_c)].filter(Number.isFinite):[];tile(tr('Temperature','Temperatura'),temps.length?Math.max(...temps)+' °C':unknown,tr('Highest available host sensor','Sensor disponible más alto'));
  const drives=valid?(health?.drives||[]):[];const bad=drives.some(d=>d.state!=='passed');tile(tr('Drive health','Salud de discos'),drives.length?(bad?tr('Review','Revisar'):tr('Passed','Correcto')):unknown,tr('SMART checks on selected drives','SMART de discos seleccionados'));
  const backups={verified:tr('Verified','Verificado'),stale:tr('Overdue','Vencido'),review:tr('Review','Revisar'),mount_unavailable:tr('Disk unavailable','Disco no disponible')};tile(tr('Backup','Respaldo'),valid?(backups[health?.backup?.state]||unknown):unknown,valid&&health?.backup?.at?new Date(health.backup.at).toLocaleString():tr('Independent backup required','Respaldo independiente requerido'));
  tile(tr('System alerts','Alertas del sistema'),valid&&typeof health?.service_alert_count==='number'?String(health.service_alert_count):unknown,tr('Review flagged services and hardware','Revisa servicios y equipo'));
  const updates={current:tr('Current','Actualizado'),review_available:tr('Review available','Revisión disponible'),no_approved_release:tr('No approved release','Sin versión aprobada')};tile(tr('Updates','Actualizaciones'),valid?(updates[health?.updates?.state]||unknown):unknown,tr('Technician approval required','Requiere aprobación del técnico'));
  $('storageTab').textContent=tr('Storage','Almacenamiento');$('recoveryTab').textContent=tr('Recovery','Recuperación');$('storageTitle').textContent=$('storageTab').textContent;$('recoveryTitle').textContent=tr('Update & recovery','Actualización y recuperación');$('driveTitle').textContent=tr('Drive health','Salud de discos');
  const sc=$('storageCards'),rc=$('recoveryCards'),rows=$('driveRows');sc.replaceChildren();rc.replaceChildren();rows.replaceChildren();
  const st=valid?health?.storage:null,rd=st?.redundancy;
  const capacity=x=>typeof x==='number'?(x/1e12).toFixed(2)+' TB':unknown;
  tile(tr('Usable capacity','Capacidad utilizable'),capacity(st?.total_bytes),tr('Mounted data filesystem','Sistema de archivos montado'),sc);
  tile(tr('Available','Disponible'),capacity(st?.free_bytes),tr('Remaining storage','Espacio restante'),sc);
  const raidState={healthy:tr('Healthy','Saludable'),degraded:tr('Degraded','Degradado'),syncing:tr('Synchronizing','Sincronizando'),review:tr('Review','Revisar')};
  tile(tr('Disk redundancy','Redundancia de discos'),raidState[rd?.state]||unknown,rd?.level==='raid1'?'RAID 1 · '+rd.expected+' '+tr('members','miembros'):tr('Redundancy not verified','Redundancia sin verificar'),sc);
  for(const [n,d] of drives.entries()){const r=create('div',undefined,'status-row');r.append(create('span',tr('Checked drive ','Disco comprobado ')+(n+1)),create('span',({passed:tr('Passed','Correcto'),failed:tr('Failed','Fallo'),review:tr('Review','Revisar')})[d.state]||unknown,'badge'));rows.append(r)}
  if(!drives.length)rows.append(create('p',unknown,'muted'));
  $('storageHelp').textContent=tr('Contact your technician for disk replacement or expansion. A mirror is not a backup.','Contacta a tu técnico para reemplazar o ampliar discos. Un espejo no es un respaldo.');
  tile(tr('Backup','Respaldo'),valid?(backups[health?.backup?.state]||unknown):unknown,valid&&health?.backup?.at?new Date(health.backup.at).toLocaleString():tr('Independent backup required','Respaldo independiente requerido'),rc);
  tile(tr('Updates','Actualizaciones'),valid?(updates[health?.updates?.state]||unknown):unknown,tr('Reviewed releases only','Solo versiones revisadas'),rc);
  const phases={idle:tr('No active operation','Sin operación activa'),preparing:tr('Preparing','Preparando'),candidate_ready:tr('Candidate ready','Candidato listo'),trial_reachable:tr('Trial reachable','Prueba disponible'),review_required:tr('Review required','Requiere revisión'),rolled_back:tr('Rolled back','Revertido')};
  tile(tr('Recovery operation','Operación de recuperación'),valid?(phases[health?.recovery?.state]||unknown):unknown,tr('Technician-supervised','Supervisión del técnico'),rc);
  $('recoveryHelp').textContent=tr('Backups and updates are managed locally with your technician. No automatic destructive actions.','Los respaldos y actualizaciones se gestionan con tu técnico. No hay acciones destructivas automáticas.');
}
async function refresh(){try{stats=await fetch('/api/status',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});failed=false}catch{failed=true}updateStatus();try{health=await fetch('/api/health',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()})}catch{health=null}renderHealth()}
$('homeIcon').append(lineIcon('hardware'));$('appsTab').onclick=()=>page('apps');$('statusTab').onclick=()=>page('status');$('setupTab').onclick=()=>page('setup');$('maintenanceTab').onclick=()=>page('maintenance');$('storageTab').onclick=()=>page('storage');$('recoveryTab').onclick=()=>page('recovery');$('lang').onclick=()=>{es=!es;try{localStorage.setItem('jobbi-dashboard-lang',es?'es':'en')}catch{}render()};render();fetch('/api/config').then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{cfg=c;render();refresh();setInterval(refresh,30000)}).catch(()=>{$('lead').textContent=tr('Configuration unavailable','Configuración no disponible')});
</script></body></html>
