services:
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile.preview
    user: "${PREVIEW_UID:?Use scripts/preview.sh}:${PREVIEW_GID:?Use scripts/preview.sh}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - "${PREVIEW_DATA:?Use scripts/preview.sh}:/demo/.jobbi-no-login-demo:Z"
    ports:
      - "127.0.0.1:8791:8791"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/api/init', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
