name: Complete Python unit regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  units:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 -m compileall -q scripts business/dashboard deploy/dashboard
