name: Disposable RAID1 replacement and expansion
on:
  workflow_dispatch:
  push:
    paths: ['scripts/storage_manager.py','scripts/raid-pilot.sh','.github/workflows/storage-raid.yml']
jobs:
  raid:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mdadm e2fsprogs
      - run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT bash scripts/raid-pilot.sh
