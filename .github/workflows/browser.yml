name: Owner dashboard browser checks
on:
  push:
    paths: ['business/**','.github/workflows/browser.yml']
  pull_request:
    paths: ['business/**','.github/workflows/browser.yml']
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'playwright==1.58.0'
      - run: python -m playwright install --with-deps chromium
      - run: python business/dashboard/browser-pilot.py
