name: Customer pilot checks
on:
  push:
    paths: ['business/**','scripts/**','deploy/**','.github/workflows/pilot.yml']
  pull_request:
    paths: ['business/**','scripts/**','deploy/**','.github/workflows/pilot.yml']
  workflow_dispatch:
    inputs:
      full_stack:
        description: 'Also start all core apps (not DNS or remote enrollment)'
        type: boolean
        default: false
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s business -p 'test_*.py'
      - run: python3 -m unittest discover -s business/sourcing -p 'test_*.py'
      - run: python3 business/sourcing/search.py --offline --output /tmp/jobbi-sourcing-ci
      - run: python3 -m py_compile scripts/*.py business/dashboard/server.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node --check business/dashboard/app.js
      - run: python3 -m unittest discover -s business/dashboard -p 'test_*.py'
      - run: |
          mkdir -p /tmp/jobbi-pilot /tmp/jobbi-backups
          python3 scripts/preflight.py --data-root /tmp/jobbi-pilot --apps monitor --minimum-free-gib 1 --minimum-docker-free-gib 1
          python3 scripts/setup-customer.py --name setup-preview --data-root /tmp/jobbi-pilot --backup-root /dev/shm --apps monitor --minimum-free-gib 1 --minimum-docker-free-gib 1
          test ! -e /tmp/jobbi-pilot/setup-preview
          python3 scripts/install.py --name first --data-root /tmp/jobbi-pilot --base-port 18100 --apps monitor
          python3 scripts/install.py --name second --data-root /tmp/jobbi-pilot --base-port 18200 --apps monitor
          for port in 18100 18200; do
            curl --retry 20 --retry-all-errors --retry-delay 2 -fsS "http://127.0.0.1:$port/healthz"
          done
          python3 - <<'PY'
          import pathlib, json, urllib.request
          base=pathlib.Path('/tmp/jobbi-pilot')
          def env(n): return dict(x.split('=',1) for x in (base/n/'.env').read_text().splitlines())
          a,b=env('first'),env('second')
          assert a['MOVIE_SECRET']!=b['MOVIE_SECRET']
          assert a['MUSIC_DB_PASSWORD']!=b['MUSIC_DB_PASSWORD']
          assert a['INSTANCE_DIR']!=b['INSTANCE_DIR']
          for port, name in [(18100,'first'),(18200,'second')]:
              with urllib.request.urlopen(f'http://127.0.0.1:{port}/api/config') as r:
                  assert json.load(r)['name'].endswith(name)
          PY
          docker network inspect jobbi-first_default jobbi-second_default --format '{{.Id}}' | sort -u | wc -l | grep -qx 2
          bash scripts/ctl.sh /tmp/jobbi-pilot/first stop
          curl -fsS http://127.0.0.1:18200/healthz
          bash scripts/ctl.sh /tmp/jobbi-pilot/first start
          curl --retry 10 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:18100/healthz
      - run: |
          printf 'pilot backup marker\n' > /tmp/jobbi-pilot/first/data/.pilot-marker
          bash scripts/backup.sh /tmp/jobbi-pilot/first /tmp/jobbi-backups --all-images
          BACKUP="$(find /tmp/jobbi-backups -mindepth 1 -maxdepth 1 -type d | head -1)"
          (cd "$BACKUP" && sha256sum -c SHA256SUMS)
          mkdir -p /tmp/jobbi-restore
          tar xzf "$BACKUP/instance.tar.gz" -C /tmp/jobbi-restore data/.pilot-marker release.json
          cmp /tmp/jobbi-pilot/first/data/.pilot-marker /tmp/jobbi-restore/data/.pilot-marker
          tar tzf "$BACKUP/instance.tar.gz" | grep -qx image-inventory.json
          python3 scripts/restore.py "$BACKUP" --require-exact-images --data-root /tmp/jobbi-pilot --name recovered --base-port 18300
          cmp /tmp/jobbi-pilot/first/data/.pilot-marker /tmp/jobbi-pilot/recovered/data/.pilot-marker
          bash scripts/ctl.sh /tmp/jobbi-pilot/recovered up -d
          curl --retry 10 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:18300/healthz
          python3 scripts/onboard.py /tmp/jobbi-pilot/recovered --mark monitor
          curl --retry 10 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:18100/healthz
          curl -fsS http://127.0.0.1:18200/healthz
      - if: always()
        run: |
          for n in first second recovered; do
            if test -f "/tmp/jobbi-pilot/$n/.env"; then
              bash scripts/ctl.sh "/tmp/jobbi-pilot/$n" down -v
            fi
          done
  full-stack:
    if: (github.event_name == 'workflow_dispatch' && inputs.full_stack) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-pilot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/jobbi-full
          python3 scripts/install.py --name full --data-root /tmp/jobbi-full --apps music,movies,photos,files,passwords,tasks,monitor
          for i in $(seq 1 45); do
            if bash scripts/verify.sh /tmp/jobbi-full/full; then python3 scripts/test-tasks-pilot.py; python3 scripts/test-files-pilot.py; exit 0; fi
            sleep 10
          done
          exit 1
      - if: failure()
        run: |
          if test -f /tmp/jobbi-full/full/.env; then
            bash scripts/ctl.sh /tmp/jobbi-full/full ps -a
            bash scripts/ctl.sh /tmp/jobbi-full/full logs --tail=45 jobbi-music jobbi-storage-agent vikunja vikunja-db
          fi
      - if: always()
        run: |
          if test -f /tmp/jobbi-full/full/.env; then
            bash scripts/ctl.sh /tmp/jobbi-full/full down -v
          fi

  media-recovery:
    if: (github.event_name == 'workflow_dispatch' && inputs.full_stack) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-pilot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p /tmp/jobbi-media /tmp/jobbi-media-backups
          python3 scripts/install.py --name source --data-root /tmp/jobbi-media --base-port 18400 --apps movies
          for i in $(seq 1 30); do
            if bash scripts/verify.sh /tmp/jobbi-media/source; then break; fi
            sleep 3
          done
          python3 scripts/test-movie-pilot.py /tmp/jobbi-media/source --fixture /tmp/jobbi-media-fixture.json
          bash scripts/backup.sh /tmp/jobbi-media/source /tmp/jobbi-media-backups
          BACKUP="$(find /tmp/jobbi-media-backups -mindepth 1 -maxdepth 1 -type d | head -1)"
          python3 scripts/restore.py "$BACKUP" --require-exact-images --data-root /tmp/jobbi-media --name recovered --base-port 18500
          bash scripts/ctl.sh /tmp/jobbi-media/recovered up -d
          for i in $(seq 1 30); do
            if bash scripts/verify.sh /tmp/jobbi-media/recovered; then break; fi
            sleep 3
          done
          python3 scripts/test-movie-pilot.py /tmp/jobbi-media/recovered --fixture /tmp/jobbi-media-fixture.json --recover
          python3 scripts/test-movie-pilot.py /tmp/jobbi-media/source --fixture /tmp/jobbi-media-fixture.json --recover
          sed -i 's/^MOVIE_HTTPS=false$/MOVIE_HTTPS=true/' /tmp/jobbi-media/recovered/.env
          bash scripts/ctl.sh /tmp/jobbi-media/recovered up -d --no-deps --force-recreate backend
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18503/api/auth/me || true)"
            if test "$code" = 401; then break; fi
            sleep 2
          done
          python3 scripts/test-movie-pilot.py /tmp/jobbi-media/recovered --fixture /tmp/jobbi-media-fixture.json --recover --secure-cookie
      - if: always()
        run: |
          for n in source recovered; do
            if test -f "/tmp/jobbi-media/$n/.env"; then
              bash scripts/ctl.sh "/tmp/jobbi-media/$n" down -v
            fi
          done
          rm -f /tmp/jobbi-media-fixture.json

  library-recovery:
    if: (github.event_name == 'workflow_dispatch' && inputs.full_stack) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-pilot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p /tmp/jobbi-library /tmp/jobbi-library-backups
          python3 scripts/install.py --name source --data-root /tmp/jobbi-library --base-port 18600 --apps music,photos
          python3 scripts/test-library-pilot.py /tmp/jobbi-library/source
          bash scripts/backup.sh /tmp/jobbi-library/source /tmp/jobbi-library-backups
          BACKUP="$(find /tmp/jobbi-library-backups -mindepth 1 -maxdepth 1 -type d | head -1)"
          python3 scripts/restore.py "$BACKUP" --require-exact-images --data-root /tmp/jobbi-library --name recovered --base-port 18700
          bash scripts/ctl.sh /tmp/jobbi-library/recovered up -d
          python3 scripts/test-library-pilot.py /tmp/jobbi-library/recovered --recover
          python3 scripts/test-library-pilot.py /tmp/jobbi-library/source --recover
      - if: failure()
        run: |
          for n in source recovered; do
            if test -f "/tmp/jobbi-library/$n/.env"; then
              bash scripts/ctl.sh "/tmp/jobbi-library/$n" ps -a
            fi
          done
      - if: always()
        run: |
          for n in source recovered; do
            if test -f "/tmp/jobbi-library/$n/.env"; then
              bash scripts/ctl.sh "/tmp/jobbi-library/$n" down -v
            fi
          done
          rm -f /tmp/jobbi-library-fixture.json

  office-recovery:
    if: (github.event_name == 'workflow_dispatch' && inputs.full_stack) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-pilot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/jobbi-office /tmp/jobbi-office-backups
          export JOBBI_PILOT_INSTANCE=/tmp/jobbi-office/source
          python3 scripts/install.py --name source --data-root /tmp/jobbi-office --base-port 18800 --apps files,tasks
          python3 scripts/test-files-pilot.py
          python3 scripts/test-tasks-pilot.py
          bash scripts/backup.sh "$JOBBI_PILOT_INSTANCE" /tmp/jobbi-office-backups
          python3 scripts/restore.py /tmp/jobbi-office-backups/jobbi-source-* --require-exact-images --data-root /tmp/jobbi-office --name recovered --base-port 18900
          export JOBBI_PILOT_INSTANCE=/tmp/jobbi-office/recovered
          bash scripts/ctl.sh "$JOBBI_PILOT_INSTANCE" up -d
          python3 scripts/test-files-pilot.py
          python3 scripts/test-tasks-pilot.py
      - if: failure()
        run: |
          for n in source recovered; do
            if test -f "/tmp/jobbi-office/$n/.env"; then
              bash scripts/ctl.sh "/tmp/jobbi-office/$n" ps -a
              bash scripts/ctl.sh "/tmp/jobbi-office/$n" logs --tail=60 vikunja vikunja-db
            fi
          done
      - if: always()
        run: |
          for n in source recovered; do
            if test -f "/tmp/jobbi-office/$n/.env"; then
              bash scripts/ctl.sh "/tmp/jobbi-office/$n" down -v
            fi
          done

  infrastructure-recovery:
    if: (github.event_name == 'workflow_dispatch' && inputs.full_stack) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-pilot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'python-socketio[client]==5.13.0'
      - run: |
          command -v dig || (sudo apt-get update && sudo apt-get install -y dnsutils)
          mkdir -p /tmp/jobbi-infra /tmp/jobbi-infra-backups
          python scripts/install.py --name source --data-root /tmp/jobbi-infra --base-port 19000 --apps passwords,monitor,dns --local-dns-port 19011
          python scripts/test-infrastructure-pilot.py /tmp/jobbi-infra/source
          bash scripts/backup.sh /tmp/jobbi-infra/source /tmp/jobbi-infra-backups
          python scripts/restore.py /tmp/jobbi-infra-backups/jobbi-source-* --require-exact-images --data-root /tmp/jobbi-infra --name recovered --base-port 19100
          bash scripts/ctl.sh /tmp/jobbi-infra/recovered up -d
          python scripts/test-infrastructure-pilot.py /tmp/jobbi-infra/recovered
      - if: always()
        run: |
          for n in source recovered; do
            if test -f "/tmp/jobbi-infra/$n/.env"; then
              bash scripts/ctl.sh "/tmp/jobbi-infra/$n" down -v
            fi
          done

  staged-upgrade:
    if: (github.event_name == 'workflow_dispatch' && inputs.full_stack) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-pilot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          mkdir -p /tmp/jobbi-upgrade /tmp/jobbi-upgrade-backups
          sudo mount -t tmpfs -o "size=2G,uid=$(id -u),gid=$(id -g),mode=0700" tmpfs /tmp/jobbi-upgrade-backups
          old=de0b98be2b2456dc98f29ca65a90e8c91946e6c5
          git worktree add --detach /tmp/jobbi-old-checkout "$old"
          python3 /tmp/jobbi-old-checkout/scripts/install.py --name original --data-root /tmp/jobbi-upgrade --base-port 19200 --apps monitor
          args=(/tmp/jobbi-upgrade/original /tmp/jobbi-upgrade-backups --from-commit "$old" --to-commit "$(git rev-parse HEAD)" --name trial --base-port 19300 --minimum-free-gib 1)
          python3 scripts/schedule-backups.py /tmp/jobbi-upgrade/original /tmp/jobbi-upgrade-backups --hour 4 --minimum-free-gib 1 --failure-unit notify-owner.service > /tmp/jobbi-schedule-preview
          grep -q 'OnFailure=notify-owner.service' /tmp/jobbi-schedule-preview
          grep -Eq -- '--expected-backup-mount [a-f0-9]{64}' /tmp/jobbi-schedule-preview
          grep -q '04:00:00' /tmp/jobbi-schedule-preview
          python3 scripts/stage-upgrade.py "${args[@]}"
          python3 scripts/stage-upgrade.py "${args[@]}" --prepare
          test -z "$(bash scripts/ctl.sh /tmp/jobbi-upgrade/trial ps -q --status running)"
          bash scripts/ctl.sh /tmp/jobbi-upgrade/trial up -d
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:19300/healthz
          bash scripts/ctl.sh /tmp/jobbi-upgrade/trial stop
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:19200/healthz
          mountid="$(python3 -c 'import sys;sys.path.insert(0,"scripts");from backup_mount import mount_identity;print(mount_identity(sys.argv[1]))' /tmp/jobbi-upgrade-backups)"
          recover=(/tmp/jobbi-upgrade/original /tmp/jobbi-upgrade-backups --mount-id "$mountid" --candidate held)
          sleep 2
          python3 scripts/recovery-center.py stage "${recover[@]}" --base-port 19400 --to-commit "$(git rev-parse HEAD)" --apply
          test -z "$(bash scripts/ctl.sh /tmp/jobbi-upgrade/original ps -q --status running)"
          python3 scripts/recovery-center.py start-trial "${recover[@]}" --apply
          python3 scripts/recovery-center.py rollback "${recover[@]}" --confirm-no-candidate-writes --apply
          test -z "$(bash scripts/ctl.sh /tmp/jobbi-upgrade/held ps -q --status running)"
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:19200/healthz
      - if: always()
        run: |
          for n in original trial held; do
            if test -f "/tmp/jobbi-upgrade/$n/.env"; then
              bash scripts/ctl.sh "/tmp/jobbi-upgrade/$n" down -v
            fi
          done
          if mountpoint -q /tmp/jobbi-upgrade-backups; then sudo umount /tmp/jobbi-upgrade-backups; fi
