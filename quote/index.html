<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jobbi Home — Instant Quote</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><main><header><strong>JOBBISOFT / HOME</strong><div class="controls"><select id="region" aria-label="Market"><option value="US">El Paso · USD</option><option value="MX">Ciudad Juárez · MXN</option></select><button id="en">English</button><button id="es">Español</button></div></header>
<h1 data-t="hero"></h1><p class="lead" data-t="lead"></p>
<section><h2 data-t="hardware"></h2><div class="split"><label><span data-t="storage"></span><strong id="capacity" class="big"></strong><input id="tb" type="range" min="1" max="40" value="8"></label><label><span data-t="performance"></span><select id="ram"><option value="8">8 GB</option><option value="16" selected>16 GB</option><option value="32">32 GB</option></select></label></div><p class="muted" data-t="guide"></p><label class="option"><input type="checkbox" id="mirror" checked><span data-t="mirror"></span></label><label class="option"><input type="checkbox" id="own"><span data-t="own"></span></label><p class="muted" data-t="ownNote"></p></section>
<section><h2 data-t="apps"></h2><div id="apps" class="grid"></div><p class="muted" data-t="appsNote"></p></section>
<section><h2 data-t="bills"></h2><div id="subs" class="grid"></div><label class="row"><span data-t="other"></span><input id="other" type="number" min="0" step="0.01" value="0"></label><p class="muted" data-t="billNote"></p></section>
<section><h2 data-t="costs"></h2><div class="grid"><label><span data-t="tariff"></span><select id="tier"></select></label><label><span data-t="rate"></span><input id="rate" type="number" min="0" max="100" step="0.001"></label><label><span data-t="power"></span><input id="watts" type="number" min="1" max="1000" step="1"></label><label><span data-t="support"></span><select id="support"><option value="6">6</option><option value="12">12</option></select></label><label><span data-t="extra"></span><input id="extra" type="number" min="0" step="0.01" value="0"></label></div><p class="muted" data-t="costNote"></p></section>
<section><h2 data-t="quote"></h2><div id="quote"></div><button id="copy" data-t="copy"></button><span id="copyStatus" role="status"></span></section>
<section><h2 data-t="savings"></h2><div id="stats" class="grid"></div><svg id="chart" viewBox="0 0 640 290" role="img" aria-label="Five year cost comparison"></svg><p class="muted" data-t="disclaimer"></p></section>
<footer data-t="footer"></footer></main></body></html>
