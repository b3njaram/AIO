<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobbiSoft Home · Setup</title><link rel="stylesheet" href="/setup.css"><script defer src="/setup.js"></script></head><body><main><header><b>JOBBISOFT / HOME</b><button id="lang" type="button">Español</button></header><h1 id="title">Set up your home</h1><p id="lead">One private session. Your accounts stay on your server.</p><section id="unlock"><h2 id="unlockTitle">Unlock setup</h2><form id="unlockForm"><label><span id="codeLabel">Setup code</span><input id="code" type="password" autocomplete="off" required></label><button id="unlockButton">Continue</button></form></section><section id="wizard" hidden><p id="progressText"></p><progress id="progress" value="0" max="1"></progress><div id="steps"></div><form id="accountForm" hidden><h2 id="appTitle"></h2><label><span id="usernameLabel">Owner username</span><input id="username" required maxlength="48" autocomplete="username"></label><label><span id="emailLabel">Owner email</span><input id="email" type="email" maxlength="254" required autocomplete="email"></label><div id="passwordFields"><label><span id="passwordLabel">New or existing password</span><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label><span id="confirmLabel">Confirm password</span><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label></div><p id="appHelp"></p><button id="createButton">Verify account</button></form><button id="finish" type="button">Close setup session</button><p id="nextNote">After setup, finish native encryption, private access and actual application tests with your technician.</p></section><p id="status" role="status" aria-live="polite"></p></main></body></html>
